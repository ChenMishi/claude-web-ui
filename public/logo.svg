<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="18" y="18" width="164" height="164" rx="32" fill="url(#bgGrad)"/>

  <!-- Subtle inner border -->
  <rect x="30" y="30" width="140" height="140" rx="24"
        fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- AI text -->
  <text x="100" y="122" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="76" fill="#ffffff" letter-spacing="-1">
    AI
  </text>

  <!-- Decorative line under AI -->
  <rect x="58" y="138" width="84" height="3" rx="1.5" fill="url(#lineGrad)"/>
</svg>
